<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Queue, clean</title>
<style>
:root { --color-surface: #ffffff; --color-text-primary: #1b1f24; --color-line: #d9d6cc; --space-2: 8px; --space-4: 16px; --radius-2: 4px; --_pad: var(--space-2); }
.queue { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); padding: calc(var(--space-4) * 2) var(--_pad); background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-line); border-radius: var(--radius-2); width: 100%; margin: 0 auto; }
.queue button { background: transparent; color: currentColor; font-family: var(--font-body), sans-serif; }
@media (max-width: 640px) { .queue { grid-template-columns: 1fr; } }
</style></head>
<body><main class="queue" style="padding-block: var(--space-2)"><p>3 new</p><button>Show</button></main></body></html>
