<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A broken page</title>
<style>
  body { margin: 0; font: 16px/1.4 Georgia, serif; }
  .wide { width: 700px; background: #ddd; }
  .tiny { font-size: 9px; }
  .dot { display: inline-block; width: 12px; height: 12px; background: #333; }
</style>
</head>
<body>
<div>
  <h1>Broken on purpose</h1>
  <div class="wide">A block wider than any phone.</div>
  <p class="tiny">Text far too small to read.</p>
  <p><a class="dot" href="#nowhere" aria-label="A target too small"></a></p>
</div>
</body>
</html>
